name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The e2e job below only runs on a manual dispatch, not on every push (§D7)
  workflow_dispatch:

env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  NODE_ENV: test
  STRIPE_PUBLISHABLE_KEY: pk_test_mock_key

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: server
      - run: npm run lint
        working-directory: client

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: client

  server-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      # mongodb-memory-server spins up its own ephemeral instance — the
      # pipeline never touches Atlas and needs no IP allowlist (R10). This
      # single job runs unit, integration, and the D4.3 concurrency test.
      - run: npm run test:coverage
        working-directory: server

  client-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test -- --coverage
        working-directory: client

  # Scans the FULL commit history (fetch-depth: 0), not just this push's
  # diff — a diff-only scan would pass forever once a secret's removal
  # commit lands, even though the secret is still live earlier in history
  # (§D7).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [lint, typecheck, server-tests, client-tests, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Build server image
        run: docker build -t encore-server:ci ./server
      - name: Build client image
        run: docker build -t encore-client:ci ./client

  # System/E2E journeys are slow and need Stripe test mode + two browser
  # contexts — run on demand and at milestones (§D7), not on every push.
  # Needs build so a dispatch never burns Playwright minutes against code
  # that doesn't even compile.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps
      - run: npx playwright test
